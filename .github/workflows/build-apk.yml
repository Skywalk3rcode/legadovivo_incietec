name: Compilar APK Android (Buildozer)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python con cache de pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite de pruebas
        env:
          # Proveedores sin pantalla para ejecutar Kivy en un runner sin X11
          KIVY_WINDOW: mock
          KIVY_INPUT: mock
          KIVY_NO_ARGS: "1"
        run: |
          python -m pytest tests/ -v

  build:
    name: Compilar APK
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias del sistema para Buildozer y Android NDK
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev openjdk-17-jdk

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Cachear artefactos de Buildozer (.buildozer)
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir artefacto APK generado
        uses: actions/upload-artifact@v4
        with:
          name: LegadoVivo-Android-Debug-APK
          path: bin/*.apk
