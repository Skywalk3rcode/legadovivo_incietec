name: Compilar APK Android (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema para Buildozer y Android NDK
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential libsqlite3-dev openjdk-17-jdk

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Subir artefacto APK generado
        uses: actions/upload-artifact@v4
        with:
          name: LegadoVivo-Android-Debug-APK
          path: bin/*.apk

